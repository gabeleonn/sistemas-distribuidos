option go_package = "raft/proto;proto";
import "google/protobuf/empty.proto";

enum LogEntryCommandType {
  LOG_ENTRY_COMMAND_SET = 0;
  LOG_ENTRY_COMMAND_DELETE = 1;
}

message LogEntryCommand {
  required LogEntryCommandType type = 1;
  required string key = 2;
  optional string value = 3; // Only for SET command
}

message LogEntry {
  required int64 index = 1;
  required int64 term = 2;
  required LogEntryCommand command = 3;
}

message AppendEntriesArguments {
  required int64 term = 1;
  required int64 leaderId = 2;
  required int64 prevLogIndex = 3;
  required int64 prevLogTerm = 4;
  repeated LogEntry entries = 5;
  required int64 leaderCommit = 6;
}

message AppendEntriesReply {
  required int64 term = 1;
  required bool success = 2;
}

message RequestVoteArguments {
  required int64 term = 1;
  required int64 candidateId = 2;
  required int64 lastLogIndex = 3;
  required int64 lastLogTerm = 4;
}

message RequestVoteReply {
  required int64 term = 1;
  required bool voteGranted = 2;
}

enum CommandType {
  COMMAND_TYPE_SET = 0;
  COMMAND_TYPE_DELETE = 1;
  COMMAND_TYPE_GET = 2;
}

message CommandExecutionArguments {
  required CommandType command = 1;
  required string key = 2;
  optional string value = 3;
}

message CommandExecutionReply {
  required bool success = 1;
  optional string value = 2; // For GET command
  required int64 leaderId = 3; // For redirecting clients to the leader if not the current node
}

message StreamStateReply {
  required int64 term = 1;
  required int64 commitIndex = 2;
  // NOTE: add other fields as needed
}

service RaftNode {
  rpc AppendEntries(AppendEntriesArguments) returns (AppendEntriesReply);
  rpc RequestVote(RequestVoteArguments) returns (RequestVoteReply);
  rpc ExecuteCommand(CommandExecutionArguments) returns (CommandExecutionReply);
  rpc StreamState(google.protobuf.Empty) returns (stream StreamStateReply);
}
